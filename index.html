<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骸王の行軍</title>
<style>
:root{
  --bg:#0d0a12; --panel:#1a1422; --panel2:#241b30; --line:#3d2f52; --text:#e8e0f0; --dim:#9a8cb0;
  --accent:#b07cff; --gold:#e0b040; --red:#ff4a5a; --green:#6ad08a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px;}
button{font-family:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:12px 16px 32px}
h1{font-size:20px;margin:4px 0 2px;letter-spacing:.1em;color:var(--accent);text-shadow:0 0 8px #6a2cc0}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px}
.res{display:flex;gap:4px;align-items:center;font-weight:bold}
.res small{color:var(--dim);font-weight:normal}
.spacer{flex:1}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 12px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.main{background:linear-gradient(#5a2a9a,#3a1a66);border-color:var(--accent);font-size:16px;padding:10px 20px;font-weight:bold}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.red{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:4px;margin-bottom:-1px}
.tab{background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;padding:8px 14px;color:var(--dim)}
.tab.on{background:var(--panel2);color:var(--text)}
.pane{background:var(--panel2);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:12px;min-height:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;position:relative;user-select:none}
.card.indeck{border-color:var(--accent);box-shadow:0 0 6px #6a2cc0 inset}
.card img{image-rendering:pixelated;height:60px;display:block;margin:2px auto}
.card .nm{font-weight:bold;font-size:13px}
.card .st{font-size:11px;color:var(--dim);line-height:1.4}
.card .row{display:flex;gap:4px;margin-top:4px}
.card .row .btn{flex:1;padding:4px;font-size:11px}
.cost{color:var(--accent)}
.lv{position:absolute;top:4px;left:6px;font-size:11px;color:var(--gold)}
.uprow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.uprow .t{flex:1}
.uprow .t b{display:block}
.uprow .t span{font-size:12px;color:var(--dim)}
.relics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.relic{background:var(--panel);border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:3px 8px;font-size:12px}
.note{font-size:12px;color:var(--dim);line-height:1.6}
/* battle */
#battle{display:none}
#cv{width:100%;image-rendering:pixelated;display:block;border:1px solid var(--line);border-radius:6px;background:#000;touch-action:manipulation}
#hud{display:flex;gap:8px;align-items:center;margin:8px 0}
#manaBox{flex:1;height:22px;background:#140e1c;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
#manaFill{height:100%;background:linear-gradient(90deg,#4a1a8a,#b07cff);width:0}
#manaTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;text-shadow:0 1px 2px #000}
#hand{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;color:var(--text);min-height:86px;overflow:hidden}
.hc img{image-rendering:pixelated;height:44px;display:block;margin:0 auto}
.hc .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .c{font-size:12px;color:var(--accent);font-weight:bold}
.hc .cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);pointer-events:none}
.hc.poor{filter:grayscale(.8) brightness(.6)}
.hc.empty{opacity:.25}
.hc .key{position:absolute;top:2px;left:4px;font-size:10px;color:var(--dim)}
#spell{min-width:110px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,2,10,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modalBox{background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
#modalBox h2{margin:0 0 6px;color:var(--accent);font-size:18px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.choice{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center;color:var(--text)}
.choice:hover{border-color:var(--gold)}
.choice img{image-rendering:pixelated;height:56px}
.choice b{display:block;margin:4px 0}
.choice span{font-size:12px;color:var(--dim)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#3a1a66;color:var(--accent);margin-bottom:4px}
@media (max-width:600px){
  #hand{grid-template-columns:repeat(3,1fr)}
  .btn.main{font-size:14px;padding:9px 14px}
}
</style>
</head>
<body>
<div id="app">
  <h1>骸王の行軍</h1>
  <div class="sub">冥王ザルヴァスの亡者軍を率い、白銀教団の砦を落とせ。</div>

  <!-- HUB -->
  <div id="hub">
    <div class="bar">
      <div class="res">💀 <span id="rSouls">0</span><small>魂貨</small></div>
      <div class="res">🔮 <span id="rCore">0</span><small>冥核</small></div>
      <div class="res"><small>ステージ</small> <span id="rStage">1</span><small>（今周の最高 <span id="rMax">1</span> / 歴代 <span id="rBest">1</span>）</small></div>
      <div class="spacer"></div>
      <button class="btn gold" id="idleBtn">放置収穫 +0</button>
    </div>
    <div class="bar">
      <button class="btn" id="stMinus">◀</button>
      <button class="btn main" id="goBtn">出撃：ステージ 1</button>
      <button class="btn" id="stPlus">▶</button>
      <div class="spacer"></div>
      <span class="note" id="stageInfo"></span>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="deck">軍勢（カード）</button>
      <button class="tab" data-tab="up">玉座の強化</button>
      <button class="tab" data-tab="reb">転生・冥王の遺志</button>
    </div>
    <div class="pane" id="pane"></div>
  </div>

  <!-- BATTLE -->
  <div id="battle">
    <canvas id="cv" width="960" height="420"></canvas>
    <div id="hud">
      <div id="manaBox"><div id="manaFill"></div><div id="manaTxt">魂力 0 / 0</div></div>
      <button class="btn" id="spell">冥王の裁き</button>
      <button class="btn" id="spdBtn">×1</button>
      <button class="btn red" id="retreat">撤退</button>
    </div>
    <div id="hand"></div>
    <div class="note" style="margin-top:6px">カードをタップ（PCは数字キー1〜6）で召喚。魂力は時間で溜まります。敵の砦を壊せば勝利、3分経過か玉座が壊されると敗北。</div>
  </div>
</div>
<div id="modal"><div id="modalBox"></div></div>

function makeSprite(rows,scale,flip){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
  const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.'||!PAL[ch])continue;
    x.fillStyle=PAL[ch];const ii=flip?(w-1-i):i;x.fillRect(ii*scale,j*scale,scale,scale);}});
  return c;
}

// ================= セーブ =================
const SAVE_KEY='necrothrone_td_v1';
function freshRun(S){
  S.souls=0;S.stage=1;S.maxStage=1;S.relics=[];S.up={regen:0,maxm:0,castle:0,wallet:0};
  S.cards={};STARTER.forEach(k=>S.cards[k]=1);
  const extra=Object.keys(CARDS).filter(k=>!STARTER.includes(k));
  for(let i=0;i<(S.talents.pact||0)&&i<extra.length;i++)S.cards[extra[i]]=1;
  S.deck=Object.keys(S.cards).slice(0,6);
}
function newSave(){const S={core:0,talents:{},rebirths:0,best:1,lastIdle:Date.now()};freshRun(S);return S;}
let S;
try{S=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){S=null}
if(!S||!S.cards){S=newSave();}
S.talents=S.talents||{};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

// ================= 計算 =================
const T=k=>S.talents[k]||0;
const relicN=k=>S.relics.filter(r=>r===k).length;
function cardLvCost(lv){return Math.floor(25*Math.pow(1.55,lv-1));}
function soulMult(){return (1+0.1*S.up.wallet)*(1+0.25*T('harvest'));}
function unitStats(id){
  const c=CARDS[id],lv=S.cards[id]||1;
  const lm=1+0.25*(lv-1);
  const atkM=lm*Math.pow(1.12,T('might'))*(1+0.15*relicN('crown'));
  const hpM=lm*Math.pow(1.12,T('flesh'))*(1+0.15*relicN('hide'));
  return {hp:Math.round(c.hp*hpM),atk:Math.round(c.atk*atkM),spd:c.spd*(1+0.12*relicN('march')),
    cd:c.cd*Math.pow(0.88,relicN('hourg'))};
}
function regenRate(){return 32*(1+0.1*S.up.regen)*(1+0.1*T('flow'))*(1+0.15*relicN('grail'));}
function maxMana(){return 600+120*S.up.maxm;}
function castleHP(){return Math.round(1500*(1+0.2*S.up.castle)*(1+0.25*relicN('shield')));}
function enemyScale(s){return {hp:Math.pow(1.13,s-1),atk:Math.pow(1.09,s-1)};}
function eBaseHP(s){return Math.round(1100*Math.pow(1.15,s-1));}
function winSouls(s){return Math.floor((40+s*14)*Math.pow(1.13,s-1)*soulMult());}
function rebirthGain(){return S.maxStage>=6?Math.floor(Math.pow(S.maxStage,1.6)/4):0;}
function idleRate(){return 0.5*S.maxStage*Math.pow(1.1,S.maxStage-1)*soulMult()*(1+0.4*T('idle'));}
function idlePending(){const sec=Math.min(8*3600,(Date.now()-S.lastIdle)/1000);return Math.floor(sec*idleRate());}
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':String(Math.floor(n));

const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=960,H=420,GROUND=340,CASTLE_X=90,EBASE_X=880,TIME_LIMIT=180;
let B=null,raf=0,last=0,speed=1;
const BG=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#07040c');g.addColorStop(.6,'#24123a');g.addColorStop(1,'#4a1e3a');
  x.fillStyle=g;x.fillRect(0,0,W,GROUND);
  // 星
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<90;i++){x.fillStyle=rnd()>.8?'#b07cff':'#d8d0e8';x.fillRect(Math.floor(rnd()*W/2)*2,Math.floor(rnd()*GROUND*0.55/2)*2,2,2);}
  // 赤い月
  const mx=640,my=80;for(let yy=-30;yy<=30;yy+=3)for(let xx=-30;xx<=30;xx+=3){const d=xx*xx+yy*yy;if(d<900){x.fillStyle=d<500?'#d84a5a':'#a8304a';if((xx+yy)%9===0&&d<600)x.fillStyle='#b8384c';x.fillRect(mx+xx,my+yy,3,3);}}
  // 山影
  const ridge=(col,base,amp,step,ph)=>{x.fillStyle=col;for(let i=0;i<W;i+=step){const hh=base+Math.sin(i*0.012+ph)*amp+Math.sin(i*0.037+ph*2)*amp*0.4;x.fillRect(i,GROUND-hh,step,hh);}};
  ridge('#1c1028',110,30,6,1);ridge('#140a1e',70,22,4,3);
  // 枯れ木と墓標
  x.fillStyle='#0c0612';
  for(const tx of [210,470,700]){x.fillRect(tx,GROUND-70,6,70);x.fillRect(tx-14,GROUND-55,14,4);x.fillRect(tx+6,GROUND-45,16,4);x.fillRect(tx-18,GROUND-63,4,10);x.fillRect(tx+20,GROUND-53,4,12);}
  for(const tx of [160,300,380,560,620,760]){x.fillRect(tx,GROUND-14,8,14);x.fillRect(tx-3,GROUND-10,14,3);}
  // 地面
  x.fillStyle='#1a1018';x.fillRect(0,GROUND,W,H-GROUND);
  for(let i=0;i<W;i+=4){x.fillStyle=(i/4)%3===0?'#2a1a24':'#22141e';x.fillRect(i,GROUND,4,4);}
  for(let i=0;i<160;i++){x.fillStyle=rnd()>.5?'#2a1c26':'#120a10';x.fillRect(Math.floor(rnd()*W/3)*3,GROUND+6+Math.floor(rnd()*(H-GROUND-8)/3)*3,3,3);}
  return c;})();

function startBattle(stage){
  const sc=enemyScale(stage);
  B={stage,t:0,units:[],proj:[],fx:[],nums:[],mana:60*T('start'),
    castle:{x:CASTLE_X,hp:castleHP(),max:castleHP()},
    ebase:{x:EBASE_X,hp:eBaseHP(stage),max:eBaseHP(stage)},
    cds:{},spawnT:2,sc,rushed:false,bossSpawned:false,spell:0,
    spellMax:30*Math.pow(0.8,relicN('bell')),over:false,kills:0,shake:0};
  B.mana=Math.min(maxMana(),B.mana);
  S.deck.forEach(id=>B.cds[id]=0);
  $('hub').style.display='none';$('battle').style.display='block';
  buildHand();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function buildHand(){
  const h=$('hand');h.innerHTML='';
  for(let i=0;i<6;i++){const id=S.deck[i];const b=document.createElement('button');b.className='hc'+(id?'':' empty');
    if(id){const c=CARDS[id];b.innerHTML='<span class="key">'+(i+1)+'</span><img src="'+IMG[c.spr].icon+'"><div class="n">'+c.name+'</div><div class="c">'+c.cost+'</div><div class="cdv"></div>';b.onclick=()=>summon(id);}
    else b.disabled=true;
    h.appendChild(b);}
}
function updateHand(){
  const els=$('hand').children;
  S.deck.forEach((id,i)=>{const e=els[i];if(!e)return;const c=CARDS[id],st=unitStats(id);
    e.classList.toggle('poor',B.mana<c.cost);
    e.querySelector('.cdv').style.height=(B.cds[id]>0?(B.cds[id]/st.cd*100):0)+'%';});
  const m=maxMana();$('manaFill').style.width=(B.mana/m*100)+'%';$('manaTxt').textContent='魂力 '+Math.floor(B.mana)+' / '+m;
  const sp=$('spell');const ready=B.spell>=B.spellMax;sp.disabled=!ready;sp.textContent=ready?'冥王の裁き ⚡':'冥王の裁き '+Math.floor(B.spell/B.spellMax*100)+'%';
}
function summon(id){
  if(!B||B.over)return;const c=CARDS[id],st=unitStats(id);
  if(B.mana<c.cost||B.cds[id]>0)return;
  B.mana-=c.cost;B.cds[id]=st.cd;
  addUnit(1,c,st.hp,st.atk,st.spd,CASTLE_X+30);
}
function addUnit(side,d,hp,atk,spd,x){
  const img=IMG[d.spr];
  B.units.push({side,d,hp,max:hp,atk,spd,x,lane:Math.random()*14,atkT:0.2,anim:0,kb:0,kbDone:0,img:side>0?img.r:img.l,w:img.r.width,h:img.r.height,walk:Math.random()*6,dead:false,hit:0});
}
function damage(u,dmg){
  if(u.dead)return;u.hp-=dmg;u.hit=0.12;
  B.nums.push({x:u.x,y:GROUND-u.h-6,v:Math.round(dmg),t:0.7,c:u.side>0?'#ff8a8a':'#ffe080'});
  const kbN=u.d.kb||1;const seg=Math.floor((1-Math.max(0,u.hp)/u.max)*kbN);
  if(u.hp<=0){u.dead=true;
    for(let i=0;i<10;i++)B.fx.push({x:u.x,y:GROUND-u.h/2,vx:(Math.random()-.5)*120,vy:-Math.random()*140,t:0.6,c:u.side>0?'#b07cff':'#e8e0c8'});
    if(u.side<0){B.kills++;B.mana=Math.min(maxMana(),B.mana+8*relicN('eater'));B.soulBonus=(B.soulBonus||0)+u.d.soul;}
  }else if(seg>u.kbDone){u.kbDone=seg;u.kb=0.35;}
}
function hitBase(side,dmg){ // side: 攻撃側
  const b=side>0?B.ebase:B.castle;b.hp-=dmg;B.shake=0.15;
  B.nums.push({x:b.x+(side>0?-20:20),y:GROUND-160,v:Math.round(dmg),t:0.7,c:side>0?'#ffe080':'#ff8a8a'});
}
function foesOf(u){return B.units.filter(o=>o.side!==u.side&&!o.dead);}
function frontDist(u,x){return (x-u.x)*u.side;}
function applyHit(u,tx,dmg,aoe){
  // tx: 着弾点。aoeなら範囲、それ以外は最も近い敵1体 or 拠点
  const baseX=u.side>0?EBASE_X-40:CASTLE_X+40;
  if(aoe){
    for(const f of foesOf(u)){if(Math.abs(f.x-tx)<=aoe)damage(f,dmg);}
    if(Math.abs(baseX-tx)<=aoe+30)hitBase(u.side,dmg);
    for(let i=0;i<8;i++)B.fx.push({x:tx+(Math.random()-.5)*aoe,y:GROUND-10-Math.random()*30,vx:0,vy:-60,t:0.4,c:u.d.proj||'#ff8a20'});
  }else{
    let best=null,bd=40;for(const f of foesOf(u)){const d=Math.abs(f.x-tx);if(d<bd){bd=d;best=f;}}
    if(best)damage(best,dmg);else if(Math.abs(baseX-tx)<50)hitBase(u.side,dmg);
  }
}
function stepUnit(u,dt){
  if(u.kb>0){u.kb-=dt;u.x-=u.side*110*dt;u.x=Math.max(CASTLE_X+10,Math.min(EBASE_X-10,u.x));return;}
  u.atkT-=dt;u.anim=Math.max(0,u.anim-dt);u.hit=Math.max(0,u.hit-dt);
  const d=u.d;
  // 回復役
  if(d.heal){
    const hurt=B.units.filter(o=>o.side===u.side&&!o.dead&&o!==u&&!o.d.boss&&o.hp<o.max*0.85&&Math.abs(o.x-u.x)<=d.range);
    if(hurt.length){if(u.atkT<=0){const tg=hurt.sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];const amt=d.heal*B.sc.atk;tg.hp=Math.min(tg.max,tg.hp+amt);
      B.nums.push({x:tg.x,y:GROUND-tg.h-6,v:'+'+Math.round(amt),t:0.7,c:'#8aff9a'});u.atkT=d.rate;u.anim=0.25;}return;}
  }
  // 最も近い前方の敵
  let tgt=null,td=Infinity;
  for(const f of foesOf(u)){const fd=frontDist(u,f.x);if(fd>=-8&&fd<td){td=fd;tgt=f;}}
  const bx=u.side>0?EBASE_X-40:CASTLE_X+40;const bd=frontDist(u,bx);
  let targetX=null;
  if(tgt&&td<=d.range&&td<=bd){targetX=tgt.x;}
  else if(bd<=d.range){targetX=bx;tgt=null;}
  if(targetX!==null){
    if(u.atkT<=0){u.atkT=d.rate;u.anim=0.25;
      if(d.proj){B.proj.push({x:u.x+u.side*u.w*0.3,y:GROUND-u.h*0.6,tx:targetX,ref:tgt,side:u.side,dmg:u.atk,aoe:d.aoe||0,c:d.proj,u,big:!!d.aoe});}
      else applyHit(u,targetX,u.atk,d.aoe||0);
    }
  }else{u.x+=u.side*u.spd*dt;u.walk+=dt*u.spd*0.25;}
}
function stepProj(p,dt){
  const tx=p.ref&&!p.ref.dead?p.ref.x:p.tx;p.tx=tx;
  const dx=tx-p.x;const sp=420*dt;
  if(Math.abs(dx)<=sp){p.done=true;applyHit(p.u,tx,p.dmg,p.aoe);}else p.x+=Math.sign(dx)*sp;
}
function enemyPool(s){
  const pool=[['foot',5]];
  if(s>=2)pool.push(['spear',3]);if(s>=3)pool.push(['xbow',3]);if(s>=5)pool.push(['priest',1.5]);
  if(s>=6)pool.push(['paladin',1.5+s*0.05]);if(s>=8)pool.push(['inq',1.5+s*0.05]);
  return pool;
}
function spawnEnemy(key){
  const e=ENEMIES[key],sc=B.sc;const bossM=1;
  addUnit(-1,e,Math.round(e.hp*sc.hp*bossM),Math.round(e.atk*sc.atk),e.spd,EBASE_X-30);
}
function enemyAI(dt){
  B.spawnT-=dt;
  if(B.spawnT<=0){
    const pool=enemyPool(B.stage);const tot=pool.reduce((a,b)=>a+b[1],0);let r=Math.random()*tot,k=pool[0][0];
    for(const [kk,w] of pool){if((r-=w)<=0){k=kk;break;}}
    spawnEnemy(k);
    const base=Math.max(1.6,4.8-B.stage*0.12);B.spawnT=base*(0.7+Math.random()*0.6)*(B.t>90?0.8:1);
  }
  if(!B.rushed&&B.ebase.hp<B.ebase.max*0.5){B.rushed=true;const pool=enemyPool(B.stage);for(let i=0;i<4;i++)setTimeout(()=>B&&!B.over&&spawnEnemy(pool[Math.floor(Math.random()*pool.length)][0]),i*350);
    B.banner={t:2,txt:'砦の兵が打って出た！'};}
  if(B.stage%5===0&&!B.bossSpawned&&B.t>12){B.bossSpawned=true;spawnEnemy('seraph');B.banner={t:2.5,txt:'熾天使 降臨'};}
}
function castSpell(){
  if(!B||B.over||B.spell<B.spellMax)return;B.spell=0;
  const dmg=Math.round(160*Math.pow(1.12,T('might'))*(1+0.3*T('wrath'))*(1+0.2*(S.maxStage-1)));
  B.pillars=[];
  for(const f of B.units.filter(u=>u.side<0&&!u.dead)){B.pillars.push({x:f.x,t:0.6});damage(f,dmg);}
  B.flash=0.4;B.shake=0.3;B.banner={t:1.5,txt:'冥王の裁き'};
}
$('spell').onclick=castSpell;
$('spdBtn').onclick=()=>{speed=speed===1?2:1;$('spdBtn').textContent='×'+speed;};
$('retreat').onclick=()=>{if(B&&!B.over)confirmModal('撤退しますか？','敗北扱いになります（少量の魂貨は得られます）。',()=>endBattle(false));};
window.addEventListener('keydown',e=>{if(!B||B.over)return;const n=parseInt(e.key);if(n>=1&&n<=6&&S.deck[n-1])summon(S.deck[n-1]);if(e.key===' '||e.key==='q'){e.preventDefault();castSpell();}});

function loop(now){
  if(!B)return;
  let dt=Math.min(0.05,(now-last)/1000)*speed;last=now;
  if(!B.over){
    const steps=speed>1?2:1;const sdt=dt/steps;
    for(let s=0;s<steps;s++){
      B.t+=sdt;B.mana=Math.min(maxMana(),B.mana+regenRate()*sdt);B.spell=Math.min(B.spellMax,B.spell+sdt);
      for(const id in B.cds)B.cds[id]=Math.max(0,B.cds[id]-sdt);
      enemyAI(sdt);
      for(const u of B.units)if(!u.dead)stepUnit(u,sdt);
      for(const p of B.proj)stepProj(p,sdt);
      B.proj=B.proj.filter(p=>!p.done);B.units=B.units.filter(u=>!u.dead);
    }
    if(B.ebase.hp<=0)endBattle(true);else if(B.castle.hp<=0||B.t>=TIME_LIMIT)endBattle(false);
    updateHand();
  }
  for(const f of B.fx){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;}B.fx=B.fx.filter(f=>f.t>0);
  for(const n of B.nums){n.t-=dt;n.y-=30*dt;}B.nums=B.nums.filter(n=>n.t>0);
  draw(dt);
  raf=requestAnimationFrame(loop);
}
function draw(dt){
  ctx.save();
  if(B.shake>0){B.shake-=dt;ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*4);}
  ctx.drawImage(BG,0,0);
  drawCastle(B.castle.x,B.castle.hp/B.castle.max,B.t);
  drawEBase(B.ebase.x,B.ebase.hp/B.ebase.max,B.t);
  // ユニット（奥から）
  const us=[...B.units].sort((a,b)=>a.lane-b.lane);
  for(const u of us){
    const bob=u.anim>0?0:Math.abs(Math.sin(u.walk))*-3;
    const lunge=u.anim>0.12?u.side*6:0;
    const flying=u.d.spr==='wraith'||u.d.spr==='seraph';
    const fy=flying?-18+Math.sin(B.t*3+u.lane)*4:0;
    const x=Math.round(u.x-u.w/2+lunge),y=Math.round(GROUND-u.h+bob+fy+u.lane*0.6-6);
    // 影
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(Math.round(u.x-u.w*0.35),GROUND+u.lane*0.6-6+u.h*0+u.h-u.h+2,Math.round(u.w*0.7),4);
    if(u.kb>0)ctx.globalAlpha=0.7;
    ctx.drawImage(u.img,x,y);
    if(u.hit>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;ctx.drawImage(u.img,x,y);ctx.globalCompositeOperation='source-over';}
    ctx.globalAlpha=1;
    if(u.hp<u.max||u.d.boss){const bw=u.d.boss?80:Math.max(20,u.w*0.7);ctx.fillStyle='#000';ctx.fillRect(Math.round(u.x-bw/2),y-6,bw,3);
      ctx.fillStyle=u.side>0?'#b07cff':'#ffd060';ctx.fillRect(Math.round(u.x-bw/2),y-6,Math.round(bw*Math.max(0,u.hp)/u.max),3);}
  }
  // 弾
  for(const p of B.proj){ctx.fillStyle=p.c;const s=p.big?6:4;ctx.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);
    ctx.globalAlpha=0.4;ctx.fillRect(Math.round(p.x-s/2-p.side*6),Math.round(p.y-s/2),s,s);ctx.globalAlpha=1;}
  // 裁きの柱
  if(B.pillars){for(const pl of B.pillars){pl.t-=dt;if(pl.t<=0)continue;ctx.globalAlpha=Math.min(1,pl.t*2);ctx.fillStyle='#7a3cc0';ctx.fillRect(pl.x-12,0,24,GROUND);ctx.fillStyle='#e0c0ff';ctx.fillRect(pl.x-4,0,8,GROUND);ctx.globalAlpha=1;}
    B.pillars=B.pillars.filter(p=>p.t>0);}
  for(const f of B.fx){ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.c;ctx.fillRect(Math.round(f.x),Math.round(f.y),3,3);}ctx.globalAlpha=1;
  ctx.font='bold 13px monospace';ctx.textAlign='center';
  for(const n of B.nums){ctx.globalAlpha=Math.min(1,n.t*2);ctx.fillStyle='#000';ctx.fillText(n.v,n.x+1,n.y+1);ctx.fillStyle=n.c;ctx.fillText(n.v,n.x,n.y);}ctx.globalAlpha=1;
  if(B.flash>0){B.flash-=dt;ctx.fillStyle='rgba(176,124,255,'+(B.flash)+')';ctx.fillRect(0,0,W,H);}
  ctx.restore();
  // HUD
  const bar=(x,y,w,r,col,label)=>{ctx.fillStyle='#000a';ctx.fillRect(x-2,y-2,w+4,14);ctx.fillStyle='#2a1a2a';ctx.fillRect(x,y,w,10);ctx.fillStyle=col;ctx.fillRect(x,y,Math.round(w*Math.max(0,r)),10);
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText(label,x,y+26);};
  bar(16,12,220,B.castle.hp/B.castle.max,'#b07cff','骨の玉座 '+Math.max(0,Math.ceil(B.castle.hp))+'/'+B.castle.max);
  bar(W-236,12,220,B.ebase.hp/B.ebase.max,'#ffd060','白銀の砦 '+Math.max(0,Math.ceil(B.ebase.hp))+'/'+B.ebase.max);
  const rem=Math.max(0,TIME_LIMIT-B.t);ctx.textAlign='center';ctx.font='bold 18px monospace';ctx.fillStyle=rem<30?'#ff4a5a':'#e8e0f0';
  ctx.fillText(Math.floor(rem/60)+':'+String(Math.floor(rem%60)).padStart(2,'0'),W/2,26);
  ctx.font='12px sans-serif';ctx.fillStyle='#9a8cb0';ctx.fillText('ステージ '+B.stage,W/2,44);
  if(B.banner&&B.banner.t>0){B.banner.t-=dt;ctx.globalAlpha=Math.min(1,B.banner.t);ctx.fillStyle='#0008';ctx.fillRect(0,110,W,44);ctx.fillStyle='#e0c0ff';ctx.font='bold 24px sans-serif';ctx.fillText(B.banner.txt,W/2,141);ctx.globalAlpha=1;}
  if(B.over){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.font='bold 40px sans-serif';ctx.fillStyle=B.won?'#e0b040':'#ff4a5a';ctx.fillText(B.won?'勝 利':'敗 北',W/2,H/2);}
}

function endBattle(won){
  if(B.over)return;B.over=true;B.won=won;
  const s=B.stage;let gain=Math.floor(won?winSouls(s):winSouls(s)*0.35*Math.min(1,B.t/60+0.3));
  gain+=Math.floor((B.soulBonus||0)*soulMult());
  S.souls+=gain;
  const first=won&&s===S.maxStage;
  if(won){if(s===S.maxStage){S.maxStage++;}S.stage=Math.min(S.maxStage,s+1);S.best=Math.max(S.best,S.maxStage);}
  save();
  const time=Math.floor(B.t);
  setTimeout(()=>{
    if(won){showReward(gain,time,first);}
    else{
      const hint=rebirthGain()>0?'<br>行き詰まったら「転生」で冥核を得て永続強化しましょう（現在 +'+rebirthGain()+' 冥核）。':'<br>カードや玉座を強化して再挑戦しましょう。';
      openModal('<h2>敗北…</h2><div class="note">戦闘時間 '+time+'秒・撃破 '+B.kills+'<br>獲得魂貨 +'+fmt(gain)+hint+'</div><div style="text-align:right;margin-top:12px"><button class="btn main" id="mOk">玉座へ戻る</button></div>');
      $('mOk').onclick=()=>{closeModal();backToHub();};
    }
  },900);
}
function showReward(gain,time,first){
  const opts=[];
  const unowned=Object.keys(CARDS).filter(k=>!S.cards[k]);
  const owned=Object.keys(S.cards);
  const pickRelic=()=>{const ks=Object.keys(RELICS);return ks[Math.floor(Math.random()*ks.length)];};
  // 初回クリア時は報酬3択、周回時は2択
  const n=first?3:2;
  const pool=[];
  if(unowned.length){// 安いカードほど出やすい
    const sorted=unowned.sort((a,b)=>CARDS[a].cost-CARDS[b].cost);pool.push({type:'card',id:sorted[Math.floor(Math.random()*Math.min(2,sorted.length))]});}
  const shuf=[...owned].sort(()=>Math.random()-.5);
  pool.push({type:'lv',id:shuf[0]});
  pool.push({type:'relic',id:pickRelic()});
  if(shuf[1])pool.push({type:'lv',id:shuf[1]});
  pool.push({type:'relic',id:pickRelic()});
  pool.push({type:'souls',v:Math.floor(gain*0.8)});
  const seen=new Set();for(const o of pool){const key=o.type+o.id;if(seen.has(key))continue;seen.add(key);opts.push(o);if(opts.length>=n)break;}
  let h='<h2>勝利！</h2><div class="note">戦闘時間 '+time+'秒・撃破 '+B.kills+'・獲得魂貨 +'+fmt(gain)+(first?'<br>新たなステージが開放された。':'')+'</div><div class="note" style="margin-top:8px">戦利品をひとつ選べ：</div><div class="choices">';
  opts.forEach((o,i)=>{
    if(o.type==='card'){const c=CARDS[o.id];h+='<button class="choice" data-i="'+i+'"><span class="tag">新カード</span><br><img src="'+IMG[c.spr].icon+'"><b>'+c.name+'</b><span>'+c.desc+'<br>魂力'+c.cost+'</span></button>';}
    else if(o.type==='lv'){const c=CARDS[o.id];h+='<button class="choice" data-i="'+i+'"><span class="tag">カード強化</span><br><img src="'+IMG[c.spr].icon+'"><b>'+c.name+' Lv'+S.cards[o.id]+'→'+(S.cards[o.id]+1)+'</b><span>無償でレベルアップ</span></button>';}
    else if(o.type==='relic'){const r=RELICS[o.id];h+='<button class="choice" data-i="'+i+'"><span class="tag">遺物</span><br><div style="font-size:40px;line-height:56px">🜏</div><b>'+r.name+'</b><span>'+r.desc+'<br>（転生まで有効・重複可）</span></button>';}
    else{h+='<button class="choice" data-i="'+i+'"><span class="tag">魂貨</span><br><div style="font-size:40px;line-height:56px">💀</div><b>+'+fmt(o.v)+' 魂貨</b><span>追加の魂貨</span></button>';}
  });
  h+='</div>';
  openModal(h);
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];
    if(o.type==='card'){S.cards[o.id]=1;if(S.deck.length<6)S.deck.push(o.id);}
    else if(o.type==='lv')S.cards[o.id]++;
    else if(o.type==='relic')S.relics.push(o.id);
    else S.souls+=o.v;
    save();closeModal();backToHub();});
}
function backToHub(){cancelAnimationFrame(raf);B=null;$('battle').style.display='none';$('hub').style.display='block';renderAll();}

renderAll();
// 初回案内
if(!S._intro){S._intro=1;save();openModal('<h2>骸王の行軍</h2><div class="note">冥王ザルヴァスよ、白銀教団が墓所を焼き払いに来る。<br><br>'+
 '・<b>出撃</b>：カードで亡者を召喚し、敵の砦を落とす（1戦30秒〜3分）<br>'+
 '・<b>強化</b>：戦いで得た魂貨でカードと玉座を強化<br>'+
 '・<b>戦利品</b>：勝利ごとに新カード・遺物・強化から選択<br>'+
 '・<b>放置収穫</b>：離れている間も魂貨が溜まる（最大8時間）<br>'+
 '・<b>転生</b>：行き詰まったらすべてを捨て、冥核で永続強化</div><div style="text-align:right;margin-top:12px"><button class="btn main" id="mOk">始める</button></div>');
 $('mOk').onclick=closeModal;}
</script>
</body>
